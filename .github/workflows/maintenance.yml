name: Repository Maintenance

on:
  schedule:
    - cron: "0 0 * * 1"  # Weekly on Monday at midnight UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  stale-issues:
    name: Handle Stale Issues and PRs
    runs-on: ubuntu-latest
    
    steps:
      - name: Mark stale issues and PRs
        uses: actions/stale@v10
        with:
          stale-issue-message: |
            This issue has been automatically marked as stale because it has not had recent activity.
            It will be closed if no further activity occurs within 7 days.
            If this is still relevant, please add a comment to keep it open.
          stale-pr-message: |
            This pull request has been automatically marked as stale because it has not had recent activity.
            It will be closed if no further activity occurs within 7 days.
            If this is still relevant, please update the PR to keep it open.
          close-issue-message: |
            This issue has been automatically closed due to inactivity.
            If you believe this issue is still relevant, please reopen it.
          close-pr-message: |
            This pull request has been automatically closed due to inactivity.
            If you believe this PR is still relevant, please reopen it.
          stale-issue-label: "stale"
          stale-pr-label: "stale"
          days-before-stale: 30
          days-before-close: 7
          exempt-issue-labels: "pinned,security,wontfix"
          exempt-pr-labels: "pinned,security,work-in-progress"
          
  dependency-updates:
    name: Check for Dependency Updates
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup PNPM
        uses: pnpm/action-setup@v2
        with:
          version: 8
          
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20.x"
          cache: "pnpm"
          
      - name: Check for updates
        run: |
          echo "## 📦 Dependency Updates Report" > dependency-report.md
          echo "" >> dependency-report.md
          echo "Generated on: $(date)" >> dependency-report.md
          echo "" >> dependency-report.md
          
          echo "### Outdated Dependencies" >> dependency-report.md
          pnpm outdated --format table >> dependency-report.md 2>&1 || echo "No outdated dependencies found." >> dependency-report.md
          
          echo "" >> dependency-report.md
          echo "### Security Audit" >> dependency-report.md
          pnpm audit --format json > audit.json 2>/dev/null || true
          
          if [ -s audit.json ] && [ "$(cat audit.json | jq '.vulnerabilities | length')" -gt 0 ]; then
            cat audit.json | jq -r '.vulnerabilities | to_entries[] | "\(.key): \(.value.severity)"' >> dependency-report.md
          else
            echo "No security vulnerabilities found." >> dependency-report.md
          fi
          
      - name: Create issue for updates
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('dependency-report.md', 'utf8');
            
            // Check if there's an existing dependency update issue
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'dependencies,maintenance'
            });
            
            const existingIssue = issues.data.find(issue => 
              issue.title.includes('Weekly Dependency Update Report')
            );
            
            if (existingIssue) {
              // Update existing issue
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body: report
              });
            } else {
              // Create new issue
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Weekly Dependency Update Report',
                body: report,
                labels: ['dependencies', 'maintenance', 'needs-triage']
              });
            }
            
  cleanup-branches:
    name: Cleanup Merged Branches
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Clean up merged branches
        run: |
          # Get all merged branches (excluding main/master)
          MERGED_BRANCHES=$(git branch -r --merged main | grep -v main | grep -v master | grep -v HEAD | sed 's/origin\///')
          
          if [ -n "$MERGED_BRANCHES" ]; then
            echo "Found merged branches:"
            echo "$MERGED_BRANCHES"
            
            # Delete merged branches that are older than 30 days
            for branch in $MERGED_BRANCHES; do
              LAST_COMMIT_DATE=$(git log -1 --format=%ct origin/$branch)
              CURRENT_DATE=$(date +%s)
              DAYS_OLD=$(( (CURRENT_DATE - LAST_COMMIT_DATE) / 86400 ))
              
              if [ $DAYS_OLD -gt 30 ]; then
                echo "Deleting branch $branch (${DAYS_OLD} days old)"
                git push origin --delete $branch || true
              fi
            done
          else
            echo "No merged branches to clean up"
          fi
          
  update-readme:
    name: Update Repository Statistics
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Generate repository statistics
        run: |
          # Count lines of code
          LOC=$(find src -name "*.ts" -o -name "*.tsx" -o -name "*.js" -o -name "*.jsx" | xargs wc -l | tail -1 | awk '{print $1}')
          
          # Count files
          FILES=$(find src -name "*.ts" -o -name "*.tsx" -o -name "*.js" -o -name "*.jsx" | wc -l)
          
          # Get last commit date
          LAST_COMMIT=$(git log -1 --format=%cd --date=short)
          
          # Create or update repository stats
          cat > .github/STATS.md << EOF
          # Repository Statistics
          
          - **Lines of Code**: $LOC
          - **Files**: $FILES
          - **Last Updated**: $LAST_COMMIT
          - **Generated**: $(date --iso-8601)
          
          ## Workflow Status
          
          - ✅ CI/CD Pipelines Active
          - ✅ Security Scanning Enabled
          - ✅ Quality Gates Configured
          - ✅ Automated Releases
          - ✅ Dependency Management
          
          EOF
          
          echo "Repository statistics updated"
          
  health-check:
    name: Repository Health Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Check repository health
        run: |
          echo "## 🏥 Repository Health Check" > health-report.md
          echo "" >> health-report.md
          echo "Generated on: $(date)" >> health-report.md
          echo "" >> health-report.md
          
          # Check for required files
          echo "### Required Files" >> health-report.md
          
          required_files=("README.md" "package.json" "LICENSE" ".gitignore" "SECURITY.md" "CONTRIBUTING.md")
          
          for file in "${required_files[@]}"; do
            if [ -f "$file" ]; then
              echo "- ✅ $file" >> health-report.md
            else
              echo "- ❌ $file (missing)" >> health-report.md
            fi
          done
          
          echo "" >> health-report.md
          echo "### GitHub Configuration" >> health-report.md
          
          # Check for GitHub configurations
          github_configs=(".github/ISSUE_TEMPLATE" ".github/workflows" ".github/PULL_REQUEST_TEMPLATE")
          
          for config in "${github_configs[@]}"; do
            if [ -d "$config" ] || [ -f "$config" ]; then
              echo "- ✅ $config" >> health-report.md
            else
              echo "- ❌ $config (missing)" >> health-report.md
            fi
          done
          
          echo "" >> health-report.md
          echo "### Recommendations" >> health-report.md
          
          # Add recommendations based on missing files
          if [ ! -f "SECURITY.md" ]; then
            echo "- Create SECURITY.md to define security policy" >> health-report.md
          fi
          
          if [ ! -f "CONTRIBUTING.md" ]; then
            echo "- Create CONTRIBUTING.md for contributor guidelines" >> health-report.md
          fi
          
          cat health-report.md
          
  notify-completion:
    name: Maintenance Summary
    runs-on: ubuntu-latest
    needs: [stale-issues, dependency-updates, cleanup-branches, update-readme, health-check]
    if: always()
    
    steps:
      - name: Post maintenance summary
        uses: actions/github-script@v8
        with:
          script: |
            const jobs = ${{ toJSON(needs) }};
            const checkMark = (result) => result === 'success' ? '✅' : result === 'skipped' ? '⏭️' : '❌';
            
            let summary = `## 🔧 Weekly Maintenance Summary\n\n`;
            summary += `**Completed on**: ${new Date().toISOString()}\n\n`;
            summary += `| Task | Status |\n`;
            summary += `| --- | --- |\n`;
            summary += `| Stale Issues Cleanup | ${checkMark(jobs['stale-issues'].result)} |\n`;
            summary += `| Dependency Updates | ${checkMark(jobs['dependency-updates'].result)} |\n`;
            summary += `| Branch Cleanup | ${checkMark(jobs['cleanup-branches'].result)} |\n`;
            summary += `| README Updates | ${checkMark(jobs['update-readme'].result)} |\n`;
            summary += `| Health Check | ${checkMark(jobs['health-check'].result)} |\n`;
            
            // Create maintenance summary issue
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Maintenance Summary - ${new Date().toISOString().split('T')[0]}`,
              body: summary,
              labels: ['maintenance', 'dependabot']
            });
            
            console.log(`Created maintenance summary: ${issue.data.html_url}`);