name: Release Automation

on:
  workflow_dispatch:
    inputs:
      release-type:
        description: "Type of release"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major
          - prerelease
      prerelease-identifier:
        description: "Prerelease identifier (alpha, beta, rc)"
        required: false
        default: "beta"

permissions:
  contents: write
  pull-requests: write
  issues: write
  pages: write
  id-token: write

jobs:
  prepare-release:
    name: Prepare Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      changelog: ${{ steps.changelog.outputs.changelog }}
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Setup Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
      - name: Setup PNPM
        uses: pnpm/action-setup@v2
        with:
          version: 8
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "pnpm"
          
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        
      - name: Bump version
        id: version
        run: |
          # Determine version bump type
          if [ "${{ inputs.release-type }}" = "prerelease" ]; then
            NEW_VERSION=$(pnpm version prerelease --preid=${{ inputs.prerelease-identifier }} --no-git-tag-version | sed 's/v//')
          else
            NEW_VERSION=$(pnpm version ${{ inputs.release-type }} --no-git-tag-version | sed 's/v//')
          fi
          
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "New version: $NEW_VERSION"
          
      - name: Generate changelog
        id: changelog
        run: |
          # Install changelog generator
          pnpm dlx conventional-changelog-cli -p angular -i CHANGELOG.md -s
          
          # Extract changelog for this release
          CHANGELOG=$(sed -n '/^## \[/,/^## \[/{/^## \[/!p;}' CHANGELOG.md | head -n -1)
          
          # Save to output
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          
      - name: Create release commit
        run: |
          git add package.json pnpm-lock.yaml CHANGELOG.md
          git commit -m "chore(release): v${{ steps.version.outputs.version }}"
          
      - name: Push changes
        run: |
          git push origin main
          
  run-tests:
    name: Run Release Tests
    needs: prepare-release
    uses: ./.github/workflows/ci.yml
    
  build-release:
    name: Build Release Assets
    runs-on: ubuntu-latest
    needs: [prepare-release, run-tests]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          
      - name: Setup PNPM
        uses: pnpm/action-setup@v2
        with:
          version: 8
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "pnpm"
          
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        
      - name: Build application
        run: |
          pnpm run build
          
          # Create release archives
          cd dist
          tar -czf ../vertimage-v${{ needs.prepare-release.outputs.version }}.tar.gz *
          zip -r ../vertimage-v${{ needs.prepare-release.outputs.version }}.zip *
          cd ..
          
      - name: Generate SBOM
        run: |
          pnpm dlx @cyclonedx/bom -o sbom-v${{ needs.prepare-release.outputs.version }}.json
          
      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: |
            vertimage-v${{ needs.prepare-release.outputs.version }}.tar.gz
            vertimage-v${{ needs.prepare-release.outputs.version }}.zip
            sbom-v${{ needs.prepare-release.outputs.version }}.json
          retention-days: 7
          
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [prepare-release, build-release]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          
      - name: Create release notes
        run: |
          cat > release-notes.md << EOF
          # Vertimage v${{ needs.prepare-release.outputs.version }}
          
          ## What's Changed
          
          ${{ needs.prepare-release.outputs.changelog }}
          
          ## Installation
          
          \`\`\`bash
          # Download and extract
          curl -L https://github.com/${{ github.repository }}/releases/download/v${{ needs.prepare-release.outputs.version }}/vertimage-v${{ needs.prepare-release.outputs.version }}.tar.gz | tar -xz
          \`\`\`
          
          ## Verification
          
          \`\`\`bash
          # Verify SBOM
          cat sbom-v${{ needs.prepare-release.outputs.version }}.json
          \`\`\`
          
          ## Full Changelog
          
          See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/v${{ needs.prepare-release.outputs.version }}/CHANGELOG.md)
          
          ---
          
          **Full Changelog**: https://github.com/${{ github.repository }}/compare/v${{ needs.prepare-release.outputs.previous_version }}...v${{ needs.prepare-release.outputs.version }}
          EOF
          
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ needs.prepare-release.outputs.version }}
          name: Release v${{ needs.prepare-release.outputs.version }}
          body_path: release-notes.md
          draft: false
          prerelease: ${{ inputs.release-type == 'prerelease' }}
          files: |
            vertimage-v${{ needs.prepare-release.outputs.version }}.tar.gz
            vertimage-v${{ needs.prepare-release.outputs.version }}.zip
            sbom-v${{ needs.prepare-release.outputs.version }}.json
            
  deploy-release:
    name: Deploy Release
    needs: create-release
    uses: ./.github/workflows/cd.yml
    
  post-release:
    name: Post Release Tasks
    runs-on: ubuntu-latest
    needs: [prepare-release, create-release, deploy-release]
    
    steps:
      - name: Create release announcement issue
        uses: actions/github-script@v7
        with:
          script: |
            const version = '${{ needs.prepare-release.outputs.version }}';
            const releaseType = '${{ inputs.release-type }}';
            
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🎉 Release v${version} Published`,
              body: `## Release v${version} has been successfully published!
              
              ### Release Information
              - **Version**: v${version}
              - **Type**: ${releaseType}
              - **Release Page**: https://github.com/${context.repo.owner}/${context.repo.repo}/releases/tag/v${version}
              - **Deployment**: https://${context.repo.owner}.github.io/${context.repo.repo}/
              
              ### Next Steps
              - [ ] Announce release on social media
              - [ ] Update documentation if needed
              - [ ] Monitor deployment health
              - [ ] Check user feedback
              
              ### Changelog
              ${{ needs.prepare-release.outputs.changelog }}
              
              cc @${context.repo.owner}
              `,
              labels: ['release', 'announcement']
            });
            
            console.log(`Created release announcement: ${issue.data.html_url}`);