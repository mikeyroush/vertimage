name: Dependency Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 0 * * 1"  # Weekly on Monday

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-audit:
    name: NPM Security Audit
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 10
          
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20.x"
          cache: "pnpm"
          
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        
      - name: Run security audit
        run: |
          echo "## 🔒 Security Audit Report" > audit-report.md
          echo "" >> audit-report.md
          echo "Generated on: $(date)" >> audit-report.md
          echo "" >> audit-report.md
          
          # Run audit and capture results
          if pnpm audit --audit-level=moderate; then
            echo "✅ No vulnerabilities found!" >> audit-report.md
          else
            echo "❌ Vulnerabilities detected:" >> audit-report.md
            pnpm audit --audit-level=moderate --json > audit.json || true
            
            # Parse and format results
            if [ -f audit.json ]; then
              cat audit.json | jq -r '.advisories | to_entries[] | "- **\(.value.module_name)** (\(.value.severity)): \(.value.title)"' >> audit-report.md 2>/dev/null || echo "See full audit output above" >> audit-report.md
            fi
          fi
          
          # Always output the report
          cat audit-report.md
          
          # Fail if high/critical vulnerabilities
          pnpm audit --audit-level=high