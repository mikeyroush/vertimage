name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build for Production
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Setup PNPM
        uses: pnpm/action-setup@v2
        with:
          version: 10
          
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20.x"
          cache: "pnpm"
          
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        
      - name: Run quality checks
        run: |
          pnpm run lint
          pnpm exec tsc --noEmit
          
      - name: Build application
        run: |
          # Set base path for GitHub Pages
          export BASE_URL="/${{ github.event.repository.name }}/"
          pnpm run build
          
      - name: Generate build info
        run: |
          cat > dist/build-info.json << EOF
          {
            "version": "$(node -p "require('./package.json').version")",
            "buildTime": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "commitSha": "${{ github.sha }}",
            "commitMessage": "${{ github.event.head_commit.message }}",
            "branch": "${{ github.ref_name }}",
            "workflow": "${{ github.workflow }}",
            "runNumber": "${{ github.run_number }}",
            "repository": "${{ github.repository }}"
          }
          EOF
          
      - name: Add security headers
        run: |
          # Create _headers file for Netlify-style headers (works with some static hosts)
          cat > dist/_headers << EOF
          /*
            X-Frame-Options: DENY
            X-Content-Type-Options: nosniff
            Referrer-Policy: strict-origin-when-cross-origin
            Permissions-Policy: camera=(), microphone=(), geolocation=()
            Content-Security-Policy: default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https://api.github.com
          EOF
          
      - name: Create 404 page
        run: |
          # Copy index.html to 404.html for SPA routing
          cp dist/index.html dist/404.html
          
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist
          
  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        
  verify-deployment:
    name: Verify Deployment
    runs-on: ubuntu-latest
    needs: deploy
    
    steps:
      - name: Wait for deployment
        run: sleep 30
        
      - name: Check deployment health
        run: |
          DEPLOY_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          
          # Check if site is accessible
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$DEPLOY_URL")
          
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "✅ Deployment successful! Site is accessible at $DEPLOY_URL"
          else
            echo "❌ Deployment verification failed. HTTP status: $HTTP_STATUS"
            exit 1
          fi
          
      - name: Run Lighthouse audit
        uses: treosh/lighthouse-ci-action@v10
        with:
          urls: |
            https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          uploadArtifacts: false
          temporaryPublicStorage: true
          
      - name: Post deployment notification
        uses: actions/github-script@v8
        if: github.event_name == 'push' && github.event.head_commit
        with:
          script: |
            const deployUrl = `https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/`;
            
            github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'success',
              target_url: deployUrl,
              description: 'Deployment successful',
              context: 'github-pages'
            });