name: Code Quality Gates

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  code-complexity:
    name: Code Complexity Analysis
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup PNPM
        uses: pnpm/action-setup@v2
        with:
          version: 8
          
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20.x"
          cache: "pnpm"
          
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        
      - name: Analyze code complexity
        run: |
          pnpm dlx code-complexity . --format json > complexity-report.json
          
          # Check complexity thresholds
          MAX_COMPLEXITY=10
          HIGH_COMPLEXITY=$(cat complexity-report.json | jq ".files[] | select(.complexity > $MAX_COMPLEXITY) | .path" | wc -l)
          
          if [ "$HIGH_COMPLEXITY" -gt 0 ]; then
            echo "❌ Found $HIGH_COMPLEXITY files with complexity > $MAX_COMPLEXITY"
            cat complexity-report.json | jq ".files[] | select(.complexity > $MAX_COMPLEXITY)"
            exit 1
          fi
          
  code-coverage:
    name: Code Coverage Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup PNPM
        uses: pnpm/action-setup@v2
        with:
          version: 8
          
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20.x"
          cache: "pnpm"
          
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        
      - name: Run tests with coverage
        run: |
          # Check if test script exists
          if pnpm run test --help > /dev/null 2>&1; then
            pnpm run test -- --coverage --watchAll=false --coverageReporters=json-summary
            
            # Extract coverage percentages
            COVERAGE_STATEMENTS=$(cat coverage/coverage-summary.json | jq '.total.statements.pct')
            COVERAGE_BRANCHES=$(cat coverage/coverage-summary.json | jq '.total.branches.pct')
            COVERAGE_FUNCTIONS=$(cat coverage/coverage-summary.json | jq '.total.functions.pct')
            COVERAGE_LINES=$(cat coverage/coverage-summary.json | jq '.total.lines.pct')
            
            # Check minimum thresholds
            MIN_COVERAGE=80
            
            if (( $(echo "$COVERAGE_LINES < $MIN_COVERAGE" | bc -l) )); then
              echo "❌ Line coverage ($COVERAGE_LINES%) is below threshold ($MIN_COVERAGE%)"
              exit 1
            fi
          else
            echo "⚠️ No test script found. Skipping coverage check."
          fi
          
  type-coverage:
    name: TypeScript Type Coverage
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup PNPM
        uses: pnpm/action-setup@v2
        with:
          version: 8
          
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20.x"
          cache: "pnpm"
          
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        
      - name: Check type coverage
        run: |
          pnpm dlx type-coverage --detail --strict --at-least 95
          
  duplication-check:
    name: Code Duplication Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Run duplication check
        run: |
          pnpm dlx jscpd src --min-lines 10 --min-tokens 50 --format json --output jscpd-report.json
          
          # Check duplication percentage
          DUPLICATION=$(cat jscpd-report.json | jq '.statistics.percentage')
          MAX_DUPLICATION=5
          
          if (( $(echo "$DUPLICATION > $MAX_DUPLICATION" | bc -l) )); then
            echo "❌ Code duplication ($DUPLICATION%) exceeds threshold ($MAX_DUPLICATION%)"
            cat jscpd-report.json | jq '.duplicates'
            exit 1
          fi
          
  accessibility-check:
    name: Accessibility Standards
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup PNPM
        uses: pnpm/action-setup@v2
        with:
          version: 8
          
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20.x"
          cache: "pnpm"
          
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        
      - name: Run accessibility linter
        run: |
          pnpm dlx eslint-plugin-jsx-a11y src --ext .jsx,.tsx --format json > a11y-report.json || true
          
          # Check for accessibility issues
          if [ -s a11y-report.json ]; then
            ERRORS=$(cat a11y-report.json | jq '.[].errorCount' | awk '{s+=$1} END {print s}')
            if [ "$ERRORS" -gt 0 ]; then
              echo "❌ Found $ERRORS accessibility issues"
              exit 1
            fi
          fi
          
  performance-budget:
    name: Performance Budget Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup PNPM
        uses: pnpm/action-setup@v2
        with:
          version: 8
          
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20.x"
          cache: "pnpm"
          
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        
      - name: Build application
        run: pnpm run build
        
      - name: Check performance budget
        run: |
          # Performance budgets
          MAX_BUNDLE_SIZE=500  # KB
          MAX_CHUNK_SIZE=200   # KB
          MAX_ASSET_SIZE=100   # KB
          
          # Check main bundle
          MAIN_SIZE=$(find dist -name "*.js" -not -name "*.chunk.js" -exec ls -l {} + | awk '{total+=$5} END{print int(total/1024)}')
          
          if [ $MAIN_SIZE -gt $MAX_BUNDLE_SIZE ]; then
            echo "❌ Main bundle size (${MAIN_SIZE}KB) exceeds limit (${MAX_BUNDLE_SIZE}KB)"
            exit 1
          fi
          
  quality-summary:
    name: Quality Gates Summary
    runs-on: ubuntu-latest
    needs: [code-complexity, code-coverage, type-coverage, duplication-check, accessibility-check, performance-budget]
    if: always()
    
    steps:
      - name: Post quality summary
        uses: actions/github-script@v7
        with:
          script: |
            const jobs = ${{ toJSON(needs) }};
            const checkMark = (result) => result === 'success' ? '✅' : '❌';
            
            let comment = `## 📊 Code Quality Gates Summary\n\n`;
            comment += `| Check | Status |\n`;
            comment += `| --- | --- |\n`;
            comment += `| Code Complexity | ${checkMark(jobs['code-complexity'].result)} |\n`;
            comment += `| Code Coverage | ${checkMark(jobs['code-coverage'].result)} |\n`;
            comment += `| Type Coverage | ${checkMark(jobs['type-coverage'].result)} |\n`;
            comment += `| Duplication Check | ${checkMark(jobs['duplication-check'].result)} |\n`;
            comment += `| Accessibility | ${checkMark(jobs['accessibility-check'].result)} |\n`;
            comment += `| Performance Budget | ${checkMark(jobs['performance-budget'].result)} |\n`;
            
            const allPassed = Object.values(jobs).every(job => job.result === 'success');
            
            if (allPassed) {
              comment += `\n✅ **All quality gates passed!**`;
            } else {
              comment += `\n❌ **Some quality gates failed.** Please review the failing checks above.`;
            }
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });