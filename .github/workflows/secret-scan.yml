name: Secret Scanning

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 2 * * *"  # Daily at 2 AM UTC

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  gitleaks:
    name: Gitleaks Secret Detection
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for better detection
          
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          
      - name: Upload Gitleaks report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          retention-days: 7
          
  trufflehog:
    name: TruffleHog Secret Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Run TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified
          
  detect-secrets:
    name: Detect Secrets
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          
      - name: Install detect-secrets
        run: |
          pip install detect-secrets
          
      - name: Run detect-secrets
        run: |
          # Create baseline if it doesn't exist
          if [ ! -f .secrets.baseline ]; then
            detect-secrets scan --baseline .secrets.baseline
          fi
          
          # Scan for secrets
          detect-secrets scan --baseline .secrets.baseline
          
          # Check for unaudited secrets
          if ! detect-secrets audit .secrets.baseline; then
            echo "❌ Potential secrets detected!"
            exit 1
          fi
          
  custom-patterns:
    name: Custom Pattern Detection
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Check for hardcoded secrets patterns
        run: |
          echo "Checking for common secret patterns..."
          
          # Define patterns to search for
          patterns=(
            "password.*=.*['\"].*['\"]"
            "api[_-]?key.*=.*['\"].*['\"]"
            "secret.*=.*['\"].*['\"]"
            "token.*=.*['\"].*['\"]"
            "private[_-]?key"
            "-----BEGIN.*PRIVATE KEY-----"
            "aws[_-]?access[_-]?key"
            "aws[_-]?secret"
            "firebase.*['\"].*['\"]"
            "mongodb://.*:.*@"
            "postgres://.*:.*@"
          )
          
          # Search for patterns
          found=false
          for pattern in "${patterns[@]}"; do
            if grep -rEi "$pattern" --include="*.js" --include="*.ts" --include="*.jsx" --include="*.tsx" --include="*.json" --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=.git .; then
              echo "❌ Found potential secret pattern: $pattern"
              found=true
            fi
          done
          
          if [ "$found" = true ]; then
            echo "❌ Potential secrets detected in codebase!"
            exit 1
          else
            echo "✅ No hardcoded secrets detected"
          fi
          
  pr-comment:
    name: Security Scan Summary
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: [gitleaks, trufflehog, detect-secrets, custom-patterns]
    
    steps:
      - name: Comment PR with results
        uses: actions/github-script@v8
        with:
          script: |
            const comment = `## 🔒 Security Scan Summary
            
            All security scans completed successfully:
            - ✅ Gitleaks: No secrets detected
            - ✅ TruffleHog: No verified secrets found
            - ✅ Detect-Secrets: No unaudited secrets
            - ✅ Custom Patterns: No hardcoded credentials
            
            Remember to:
            - Never commit secrets or API keys
            - Use environment variables for sensitive data
            - Review the [security guidelines](../blob/main/SECURITY.md)
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });