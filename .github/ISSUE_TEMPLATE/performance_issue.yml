name: Performance Issue
description: Report a performance problem or slowdown
title: "[PERF] "
labels: ["performance", "needs-triage"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Help us improve performance by providing detailed information about the issue.
        
  - type: textarea
    id: description
    attributes:
      label: Performance Issue Description
      description: Describe the performance problem you're experiencing.
      placeholder: The app becomes slow when...
    validations:
      required: true
      
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce the performance issue?
      placeholder: |
        1. Upload a large image (>5MB)
        2. Set drone count to maximum
        3. Toggle "Avoid Dark Areas"
        4. Notice lag in preview
    validations:
      required: true
      
  - type: dropdown
    id: frequency
    attributes:
      label: Frequency
      description: How often does this occur?
      options:
        - Always
        - Often
        - Sometimes
        - Rarely
    validations:
      required: true
      
  - type: textarea
    id: metrics
    attributes:
      label: Performance Metrics
      description: If available, provide performance metrics (e.g., load time, FPS, memory usage)
      placeholder: |
        - Page load time: X seconds
        - Memory usage: X MB
        - CPU usage: X%
        
  - type: dropdown
    id: device
    attributes:
      label: Device Type
      description: What type of device are you using?
      options:
        - Desktop (High-end)
        - Desktop (Mid-range)
        - Desktop (Low-end)
        - Laptop (High-end)
        - Laptop (Mid-range)
        - Laptop (Low-end)
        - Mobile (High-end)
        - Mobile (Mid-range)
        - Mobile (Low-end)
        - Tablet
    validations:
      required: true
      
  - type: textarea
    id: system
    attributes:
      label: System Information
      description: Please provide your system specs
      placeholder: |
        - OS: Windows 11 / macOS 14 / Ubuntu 22.04
        - RAM: 16GB
        - CPU: Intel i7-10700K
        - GPU: NVIDIA GTX 1660
        - Browser: Chrome 120
        
  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add any other context about the performance issue here.